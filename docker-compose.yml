version: '3.8'

services:
  hr-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-${APP_URL}}
    container_name: hr_tools_web
    restart: always
    ports:
      - "3100:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - APP_URL=${APP_URL}
      - DEFAULT_USER_NAME=${DEFAULT_USER_NAME}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
      - DEV_USER_NAME=${DEV_USER_NAME}
      - DEV_USER_EMAIL=${DEV_USER_EMAIL}
      - DEV_USER_PASSWORD=${DEV_USER_PASSWORD}
      - HR_NOTIFY_EMAIL=${HR_NOTIFY_EMAIL}
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL:-http://email_web:3000}
      - EMAIL_SERVICE_API_KEY=${EMAIL_SERVICE_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - email_net

networks:
  # Join network Docker Compose yang SUDAH ADA punya Kurma Mail (email-company),
  # supaya bisa panggil http://email_web:3000 langsung tanpa expose port
  # tambahan ke publik. Nama network ini otomatis dibuat Compose dari nama
  # folder project email-company ("email-custom") + "_default".
  email_net:
    name: email-custom_default
    external: true
